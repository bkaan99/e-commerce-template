name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce
          POSTGRES_DB: ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_URL: http://localhost:3000
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only
      DATABASE_URL: postgresql://ecommerce:ecommerce@localhost:5432/ecommerce
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      MAIL_FROM: no-reply@localhost

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build

      - name: Uçtan uca testler hazırlığı (migrasyon, seed, tarayıcı)
        run: |
          npm run db:deploy
          npm run db:seed
          npx playwright install --with-deps chromium

      - name: Uçtan uca testler
        run: npm run test:e2e
        env:
          # PayTR anahtarı olmayan ortamda geliştirme ödeme sağlayıcısı kullanılır.
          NODE_ENV: development

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
